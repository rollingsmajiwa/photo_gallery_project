{% extends "base.html" %}
{% block title %}Contact {% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-sm border border-gray-200">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Contact Us</h2>
        <p class="text-gray-600 text-sm mt-1">Have a question or message? Send a note below.</p>
    </div>

    {% if success %}
        <div class="mb-6 p-4 bg-gray-100 border border-gray-300 text-gray-800 rounded text-sm text-center font-medium">
            Message sent successfully! Thank you for reaching out.
        </div>
    {% endif %}

    <form method="post" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label for="first_name" class="block text-sm font-semibold text-gray-700 mb-1">First Name</label>
            <input type="text" id="first_name" name="first_name" required 
                   placeholder="Enter your first name"
                   class="w-full px-3.5 py-2 bg-gray-50 border border-gray-300 rounded text-gray-900">
        </div>

        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" name="email" required 
                   placeholder="eg, rollingsmajiwa@gmail.com"
                   class="w-full px-3.5 py-2 bg-gray-50 border border-gray-300 rounded text-gray-900">
        </div>

        <div>
            <label for="message" class="block text-sm font-semibold text-gray-700 mb-1">Message</label>
            <textarea id="message" name="message" rows="4" required 
                      placeholder="Write your message here..."
                      class="w-full px-3.5 py-2 bg-gray-50 border border-gray-300 rounded text-gray-900"></textarea>
        </div>

        <button type="submit" 
                class="w-full bg-black hover:bg-gray-800 text-white font-medium py-2.5 rounded">
            Send Message
        </button>
    </form>
</div>
{% endblock %}
