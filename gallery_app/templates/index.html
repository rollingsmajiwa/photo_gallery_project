{% extends "base.html" %}
{% load static %}



    {% block content %}
    <section class="bg-gray-900 text-white rounded-xl p-10 mb-16 shadow-md">
    <div class="max-w-3xl mx-auto text-center space-y-4">
        <h1 class="text-3xl font-extrabold">Welcome to my Gallery App</h1>
        <p class="text-gray-300 text-base">{{ message }}</p>
        <div class="pt-5 flex justify-center">
            <a href="{% url 'gallery' %}" class="bg-white text-gray-900 hover:bg-gray-200 font-semibold px-6 py-2.5 rounded transition">
                Explore Gallery
            </a>
        </div>
    </div>
</section>


<section>
    <div class="flex justify-between items-center mb-7">
        <h2 class="text-2xl font-bold text-gray-900">Featured Photos</h2>
        <a href="{% url 'gallery' %}" class="text-sm font-semibold text-gray-700 underline">View all</a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
        {% for photo in photos|slice:":3" %}
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                <img src="{{ photo.image.url }}" alt="{{ photo.title }}" class="w-full h-48 object-cover">
                <div class="p-4 border-t border-gray-100">
                    <h3 class="font-medium text-gray-900 text-base truncate">{{ photo.title }}</h3>
                </div>
            </div>
        {% empty %}
            <div class="col-span-full bg-white p-8 rounded-lg border text-center text-gray-500">
                No photos uploaded yet!
            </div>
        {% endfor %}
    </div>
</section>
    {% endblock %}
